<!--
  Sign-in email for Kitchen Table. Registered as
  [auth.email.template.magic_link] in supabase/config.toml, so it is the one
  definition used by both the local stack and the hosted project (D95).

  It must contain {{ .Token }}. Sign-in is code-entry OTP -- the app asks for a
  typed 6-digit code (auth_repository.dart, verifyOTP with OtpType.email) and
  there is no deep link registered on either platform. Hosted GoTrue's stock
  magic-link template carries only {{ .ConfirmationURL }}, which would arrive
  with nothing to type.

  Serbian first, English under it: the app is bilingual and the email is sent
  before anyone has picked a language. Inline styles only -- mail clients drop
  <style> blocks.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#faf7f4;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:440px;background:#ffffff;border-radius:12px;padding:32px;">
        <tr>
          <td style="font-size:18px;font-weight:600;color:#7a5c3e;padding-bottom:24px;">
            Kitchen Table
          </td>
        </tr>

        <tr>
          <td style="font-size:15px;line-height:1.5;color:#3b322b;">
            Vaš kod za prijavu:
          </td>
        </tr>
        <tr>
          <td style="font-size:32px;font-weight:700;letter-spacing:6px;color:#3b322b;padding:16px 0;">
            {{ .Token }}
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:1.5;color:#6b6258;padding-bottom:24px;">
            Unesite ga u aplikaciji. Važi jedan sat.
            Ako niste tražili prijavu, slobodno zanemarite ovu poruku.
          </td>
        </tr>

        <tr>
          <td style="border-top:1px solid #ece5dd;padding-top:24px;font-size:13px;line-height:1.5;color:#6b6258;">
            Your sign-in code is <strong style="color:#3b322b;">{{ .Token }}</strong>.
            Enter it in the app. It is valid for one hour.
            If you did not request it, you can ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
